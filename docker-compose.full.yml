# Stack completa: Postgres + API + Web + Nginx
# Ideal para testar no servidor do cliente antes de ir para Vercel/produção.
#
# Uso rápido (localhost):
#   cp .env.example .env.full
#   # Ajustar JWT_SECRET, UAZAPI_*, POSTGRES_PASSWORD em .env.full
#   docker compose -f docker-compose.full.yml --env-file .env.full up -d --build
#   # Acesse http://localhost
#
# Uso em servidor remoto (ex: IP 192.168.1.10):
#   Adicionar no .env.full:
#     WEB_URL=http://192.168.1.10
#     API_PUBLIC_URL=http://192.168.1.10/api
#   docker compose -f docker-compose.full.yml --env-file .env.full up -d --build
#   # Acesse http://192.168.1.10
#
# Porta exposta: 80 (nginx)
# A API fica acessível em http://HOST/api  (não expõe a porta 3001 diretamente)

services:
  postgres:
    image: postgres:16-alpine
    container_name: botchef-postgres-full
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-botchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botchef}
      POSTGRES_DB:       ${POSTGRES_DB:-botchef}
    volumes:
      - postgres_full_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botchef} -d ${POSTGRES_DB:-botchef}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: botchef-api-full
    restart: unless-stopped
    environment:
      DATABASE_URL:        postgresql://${POSTGRES_USER:-botchef}:${POSTGRES_PASSWORD:-botchef}@postgres:5432/${POSTGRES_DB:-botchef}
      JWT_SECRET:          ${JWT_SECRET:-dev-secret-troque-em-producao}
      API_PORT:            "3001"
      API_HOST:            "0.0.0.0"
      API_PUBLIC_URL:      ${API_PUBLIC_URL:-http://localhost/api}
      WEB_URL:             ${WEB_URL:-http://localhost}
      UAZAPI_BASE_URL:     ${UAZAPI_BASE_URL:-https://api.uazapi.dev}
      UAZAPI_GLOBAL_TOKEN: ${UAZAPI_GLOBAL_TOKEN:-}
      NODE_ENV:            production
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # /api → nginx faz o proxy para api:3001 (sem rebuild ao trocar de servidor)
        NEXT_PUBLIC_API_URL: /api
    container_name: botchef-web-full
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_URL:  ${WEB_URL:-http://localhost}
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: botchef-nginx-full
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_full_data:
