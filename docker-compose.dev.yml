# API + Postgres em Docker com hot-reload.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up --build
#
# O source da API é montado como volume — salvar um arquivo dispara o recompile.
# O frontend roda separado (Vercel em produção / "pnpm --filter web dev" localmente).

services:
  postgres:
    image: postgres:16-alpine
    container_name: botchef-postgres-dev
    environment:
      POSTGRES_USER: botchef
      POSTGRES_PASSWORD: botchef
      POSTGRES_DB: botchef
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botchef -d botchef"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.dev
    container_name: botchef-api-dev
    environment:
      DATABASE_URL: postgresql://botchef:botchef@postgres:5432/botchef
      JWT_SECRET: dev-secret-troque-em-producao
      API_PORT: "3001"
      API_HOST: "0.0.0.0"
      API_PUBLIC_URL: http://localhost:3001
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL:-https://api.uazapi.dev}
      UAZAPI_GLOBAL_TOKEN: ${UAZAPI_GLOBAL_TOKEN:-}
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
